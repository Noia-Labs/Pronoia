name: pronoia-share

services:
  pronoia:
    image: pronoia-share:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env.share
    environment:
      PORT: "${PORT:-8000}"
      FEVER_DB_PATH: /var/lib/pronoia/fever.db
      FEVER_DATA_DIR: /var/lib/pronoia/data
      PRONOIA_SHARE_MODE: "1"
      PRONOIA_SHARE_USER: "${PRONOIA_SHARE_USER:?set PRONOIA_SHARE_USER in .env.share}"
      PRONOIA_SHARE_PASSWORD: "${PRONOIA_SHARE_PASSWORD:?set PRONOIA_SHARE_PASSWORD in .env.share}"
    ports:
      # Loopback is the safe default. Put an HTTPS reverse proxy in front when
      # sharing outside this machine; do not expose this port directly.
      - "${PRONOIA_BIND_ADDRESS:-127.0.0.1}:${PRONOIA_HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      - pronoia-state:/var/lib/pronoia
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT','8000') + '/api/health', timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

volumes:
  pronoia-state:
